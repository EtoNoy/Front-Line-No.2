    <script>
      // Prevent runtime "Cannot set property fetch of #<Window> which has only a getter" exception
      // with sandboxed iframe proxies or interceptors
      (function() {
        try {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return originalFetch;
            },
            set: function(val) {
              originalFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("Failed to patch window.fetch setter:", e);
        }
      })();
    </script>
